<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
/>

<div class="container-fluid m-0 min-vh-100 d-flex flex-column" style="min-height: 100vh;">
  <div class="row flex-shrink-0">
    <div class="p-4 col-2 border-bottom-0">Credito</div>
    <div class="p-4 col-10 border-bottom">Gestion de Clientes</div>
  </div>
  <div class="row flex-grow-1" style="flex: 1 1 auto; min-height: 0;">
    <div class="col-2 border-end">
      <ul class="nav flex-column">
        <li class="nav-item mt-3 mb-2">
          <a class="nav-link text-secondary" routerLink="/dashboard"><i class="bi bi-house-door-fill"></i> Dashboard</a>
        </li>
        <li class="nav-item mb-2">
          <a class="nav-link text-secondary" routerLink="/orders"><i class="bi bi-box2-fill"></i> Pedidos</a>
        </li>
        <li class="nav-item mb-2">
          <a class="nav-link text-secondary" routerLink="/products"><i class="bi bi-archive-fill"></i> Productos</a>
        </li>
        <li class="nav-item mb-2">
          <a class="nav-link" routerLink="/clients"><i class="bi bi-person-fill"></i> Usuarios</a>
        </li>
        <li class="nav-item mb-2">
          <a class="nav-link text-secondary" routerLink="/categories"><i class="bi bi-funnel-fill"></i> Categorias</a>
        </li>
        <li class="nav-item mb-2">
          <a class="nav-link text-secondary" routerLink="/shopping-cart"><i class="bi bi-cart-fill"></i> Carrito de la compra</a>
        </li>
      </ul>
    </div>

    <div class="col-10 bg-light">
      <main>
        <div class="container mt-4 pb-4">
          <div class="row justify-content-center">
            @if (errors.length > 0) {
              <div class="alert alert-danger w-100" style="max-width: 760px;">
                <ul class="mb-0">
                  @for (error of errors; track $index) {
                    <li>{{ error }}</li>
                  }
                </ul>
              </div>
            }

            <div class="col-lg-9">
              <div class="card shadow-sm">
                <div class="card-header bg-success text-white">
                  <h4 class="mb-0">
                    <i class="bi bi-person-plus-fill"></i>
                    {{ clientId ? 'Editar Cliente' : 'Crear Cliente' }}
                  </h4>
                </div>

                <div class="card-body p-4">
                  <form [formGroup]="createForm" (ngSubmit)="validateForm()" novalidate>
                    <div class="row">
                      <div class="col-md-6">
                        <div class="mb-3">
                          <label for="nombre" class="form-label">Nombre <span class="text-danger">*</span></label>
                          <input type="text" class="form-control" id="nombre" placeholder="Nombre" formControlName="nombre" required>
                        </div>

                        <div class="mb-3">
                          <label for="apellidos" class="form-label">Apellidos <span class="text-danger">*</span></label>
                          <input type="text" class="form-control" id="apellidos" placeholder="Apellidos" formControlName="apellidos" required>
                        </div>

                        <div class="mb-3">
                          <label for="dni" class="form-label">DNI <span class="text-danger">*</span></label>
                          <input type="text" class="form-control" id="dni" placeholder="DNI" formControlName="dni" required>
                        </div>

                        <div class="mb-3">
                          <label for="telefono" class="form-label">Telefono <span class="text-danger">*</span></label>
                          <input type="tel" class="form-control" id="telefono" placeholder="+34 600 123 456" formControlName="telefono" required>
                        </div>

                        <div class="mb-3">
                          <label for="saldo" class="form-label">Saldo <span class="text-danger">*</span></label>
                          <input type="number" class="form-control" id="saldo" placeholder="1000" formControlName="saldo" required>
                        </div>
                      </div>

                      <div class="col-md-6">
                        <div class="mb-3">
                          <label for="email" class="form-label">Email <span class="text-danger">*</span></label>
                          <input type="email" class="form-control" id="email" placeholder="correo@dominio.com" formControlName="email" required>
                        </div>

                        <div class="mb-3">
                          <label for="password" class="form-label">Contrasena <span class="text-danger">*</span></label>
                          <input type="password" class="form-control" id="password" placeholder="Contrasena" formControlName="password" [required]="!clientId">
                        </div>

                        <div class="mb-3">
                          <label for="password_confirmation" class="form-label">Confirmar contrasena <span class="text-danger">*</span></label>
                          <input type="password" class="form-control" id="password_confirmation" placeholder="Confirmar contrasena" formControlName="password_confirmation" [required]="!clientId">
                        </div>

                        <div class="mb-3">
                          <label for="provincia" class="form-label">Provincia <span class="text-danger">*</span></label>
                          <input type="text" class="form-control" id="provincia" placeholder="Provincia" formControlName="provincia" required>
                        </div>

                        <div class="mb-3">
                          <label for="municipio" class="form-label">Municipio <span class="text-danger">*</span></label>
                          <input type="text" class="form-control" id="municipio" placeholder="Municipio" formControlName="municipio" required>
                        </div>
                      </div>
                    </div>

                    <div class="row">
                      <div class="col-md-8">
                        <div class="mb-3">
                          <label for="calle" class="form-label">Calle <span class="text-danger">*</span></label>
                          <input type="text" class="form-control" id="calle" placeholder="Calle Mayor" formControlName="calle" required>
                        </div>
                      </div>
                      <div class="col-md-4">
                        <div class="mb-3">
                          <label for="numCasa" class="form-label">Numero de casa <span class="text-danger">*</span></label>
                          <input type="text" class="form-control" id="numCasa" placeholder="15" formControlName="numCasa" required>
                        </div>
                      </div>
                    </div>

                    <div class="d-flex gap-2 justify-content-end mt-3 border-top pt-3">
                      <a routerLink="/clients" class="btn btn-secondary">
                        <i class="bi bi-x-circle"></i> Cancelar
                      </a>
                      <button type="submit" class="btn bg-success text-white" [disabled]="isSaving">
                        <i class="bi bi-save"></i> Guardar usuario
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>
</div>
